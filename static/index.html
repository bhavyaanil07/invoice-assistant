<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayNudge</title>
<style>
:root{--blue:#0070e0;--navy:#003087;--bg:#f5f7fa;--card:#fff;--text:#1a1a1a;--muted:#6b7280;--border:#e5e7eb;--green:#15803d;--red:#b91c1c;--amber:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:baseline;gap:12px}
header h1{font-size:20px;margin:0}
header span{opacity:.8;font-size:14px}
main{display:grid;grid-template-columns:1fr 360px;gap:16px;padding:16px;height:calc(100vh - 56px)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;min-height:0}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--blue);color:#fff}
.assistant{align-self:flex-start;background:#eef2f7}
.assistant a{color:var(--blue);word-break:break-all}
.thinking{align-self:flex-start;color:var(--muted);font-style:italic}
.card{align-self:flex-start;border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:10px;padding:12px 14px;width:min(380px,90%);background:#fff}
.card h3{margin:0 0 8px;font-size:15px}
.card .row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;gap:12px}
.card .row span:first-child{color:var(--muted)}
.card .row span:last-child{text-align:right;word-break:break-all}
.card .note{font-size:14px;background:#f9fafb;padding:8px;border-radius:6px;margin-top:6px;white-space:pre-wrap}
.card .buttons{display:flex;gap:8px;margin-top:10px}
.card .result{margin-top:8px;font-size:14px;font-weight:600}
button{font:inherit;border:none;border-radius:8px;padding:8px 14px;cursor:pointer}
.primary{background:var(--blue);color:#fff}
.secondary{background:#e5e7eb}
button:disabled{opacity:.5;cursor:default}
.suggestions{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 4px}
.suggestions button{background:#eef2f7;font-size:13px;padding:6px 10px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
#input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font:inherit}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.panel-head h2{margin:0;font-size:16px}
#invoices{overflow-y:auto;padding:8px 12px}
.inv{padding:10px 4px;border-bottom:1px solid var(--border);font-size:14px}
.inv .top{display:flex;justify-content:space-between;font-weight:600}
.inv .sub{display:flex;justify-content:space-between;color:var(--muted);margin-top:4px}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.paid{background:#dcfce7;color:var(--green)}
.overdue{background:#fee2e2;color:var(--red)}
.unpaid{background:#fef3c7;color:var(--amber)}
.other{background:#e5e7eb;color:#374151}
@media (max-width:800px){main{grid-template-columns:1fr;height:auto}#messages{height:60vh}}
</style>
</head>
<body>
<header><h1>PayNudge</h1><span>AI invoicing assistant powered by PayPal</span></header>
<main>
  <section class="panel">
    <div id="messages"></div>
    <div class="suggestions">
      <button type="button" data-text="Who still owes me money?">Who owes me?</button>
      <button type="button" data-text="Draft reminders for everyone who is overdue">Remind overdue clients</button>
    </div>
    <form id="chat-form">
      <input id="input" autocomplete="off" placeholder='Try: "Bill Rahul at rahul@example.com $150 for website design, due Friday"'>
      <button class="primary" type="submit">Send</button>
    </form>
  </section>
  <aside class="panel">
    <div class="panel-head"><h2>Invoices</h2><button class="secondary" id="refresh" type="button">Refresh</button></div>
    <div id="invoices"><p style="color:var(--muted)">Loading...</p></div>
  </aside>
</main>
<script>
const sessionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random();
const messages = document.getElementById("messages");
const form = document.getElementById("chat-form");
const input = document.getElementById("input");

function escapeHtml(t) {
  return String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function linkify(t) {
  return escapeHtml(t).replace(/(https?:\/\/[^\s)]+[^\s).,])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function scrollDown() { messages.scrollTop = messages.scrollHeight; }

function addMessage(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = linkify(text);
  messages.appendChild(d);
  scrollDown();
}
function showThinking() {
  const d = document.createElement("div");
  d.className = "thinking";
  d.textContent = "Thinking...";
  messages.appendChild(d);
  scrollDown();
  return d;
}

async function post(url, data) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)});
  if (!r.ok) throw new Error("Server error " + r.status);
  return r.json();
}

function row(label, value) {
  const d = document.createElement("div");
  d.className = "row";
  const a = document.createElement("span");
  a.textContent = label;
  const b = document.createElement("span");
  b.textContent = value;
  d.append(a, b);
  return d;
}

function addActionCard(action) {
  const card = document.createElement("div");
  card.className = "card";
  const h = document.createElement("h3");
  card.appendChild(h);
  if (action.type === "invoice") {
    h.textContent = "Review invoice";
    card.append(
      row("Client", action.client_name),
      row("Email", action.client_email),
      row("For", action.item),
      row("Amount", "$" + Number(action.amount).toFixed(2)),
      row("Due", action.due_date)
    );
  } else {
    h.textContent = "Review reminder";
    card.append(row("Client", action.client_name), row("Invoice", action.invoice_id));
    const n = document.createElement("div");
    n.className = "note";
    n.textContent = action.message;
    card.appendChild(n);
  }
  const buttons = document.createElement("div");
  buttons.className = "buttons";
  const yes = document.createElement("button");
  yes.className = "primary";
  yes.textContent = action.type === "invoice" ? "Send via PayPal" : "Send reminder";
  const no = document.createElement("button");
  no.className = "secondary";
  no.textContent = "Cancel";
  buttons.append(yes, no);
  card.appendChild(buttons);
  const result = document.createElement("div");
  result.className = "result";
  card.appendChild(result);
  yes.onclick = () => decide(action, true, yes, no, result);
  no.onclick = () => decide(action, false, yes, no, result);
  messages.appendChild(card);
  scrollDown();
}

async function decide(action, approved, yes, no, result) {
  yes.disabled = true;
  no.disabled = true;
  result.textContent = approved ? "Sending..." : "Cancelled";
  const t = showThinking();
  try {
    const data = await post("/api/confirm", {session_id: sessionId, action_id: action.id, approved: approved});
    t.remove();
    if (approved) {
      result.textContent = (data.result && !data.result.error) ? "\u2713 Sent through PayPal" : "\u2717 Something went wrong";
    }
    handleResponse(data);
    loadInvoices();
  } catch (e) {
    t.remove();
    result.textContent = "\u2717 " + e.message;
  }
}

function handleResponse(data) {
  if (data.reply) addMessage("assistant", data.reply);
  (data.actions || []).forEach(addActionCard);
}

async function sendMessage(text) {
  addMessage("user", text);
  const t = showThinking();
  try {
    const data = await post("/api/chat", {session_id: sessionId, message: text});
    t.remove();
    handleResponse(data);
    loadInvoices();
  } catch (e) {
    t.remove();
    addMessage("assistant", "Sorry, I couldn't reach the server. " + e.message);
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendMessage(text);
});
document.querySelectorAll(".suggestions button").forEach(b => b.onclick = () => sendMessage(b.dataset.text));

function badge(inv) {
  if (inv.status === "PAID" || inv.status === "MARKED_AS_PAID") return ["paid", "Paid"];
  if (inv.overdue) return ["overdue", "Overdue"];
  if (["SENT", "UNPAID", "PARTIALLY_PAID", "PAYMENT_PENDING"].includes(inv.status)) return ["unpaid", "Unpaid"];
  return ["other", inv.status];
}

async function loadInvoices() {
  const box = document.getElementById("invoices");
  try {
    const r = await fetch("/api/invoices");
    const data = await r.json();
    if (data.error) { box.innerHTML = "<p>Could not load invoices.</p>"; return; }
    if (!data.invoices.length) { box.innerHTML = '<p style="color:var(--muted)">No invoices yet.</p>'; return; }
    box.innerHTML = "";
    data.invoices.forEach(inv => {
      const [cls, label] = badge(inv);
      const d = document.createElement("div");
      d.className = "inv";
      d.innerHTML =
        '<div class="top"><span>' + escapeHtml(inv.client) + '</span><span>$' + escapeHtml(String(inv.amount).split(" ")[0]) + '</span></div>' +
        '<div class="sub"><span>Due ' + escapeHtml(inv.due_date || "-") + '</span><span class="badge ' + cls + '">' + escapeHtml(label) + '</span></div>';
      box.appendChild(d);
    });
  } catch (e) {
    box.innerHTML = "<p>Could not load invoices.</p>";
  }
}
document.getElementById("refresh").onclick = loadInvoices;

async function startup() {
  loadInvoices();
  const t = showThinking();
  try {
    const data = await post("/api/nudge", {session_id: sessionId});
    t.remove();
    handleResponse(data);
  } catch (e) {
    t.remove();
    addMessage("assistant", "Hi! I'm PayNudge. Tell me who to bill and I'll handle the PayPal invoice.");
  }
}
startup();
</script>
</body>
</html>
